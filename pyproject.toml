[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-inference"
version = "0.1.0"
description = "TrOCR inference and evaluation for the Flow Project"
readme = { file = "README.md", content-type = "text/markdown" }

authors = [
    { name = "Dana Rebecca Meyer", email = "dameyer@techfak.uni-bielefeld.de" },
    { name = "Jonas Widmer", email = "jonas.widmer@unibe.ch" }
]

requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = { text = "MIT" }

dependencies = [
  "torch>=2.6",
  "torchvision>=0.19",
  "transformers~=4.45.2",
  "datasets>=3.6",
  "huggingface-hub>=0.34",
  "evaluate>=0.4",
  "pandas>=2.3",
  "numpy>=1.26",
  "pillow>=11.0",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "lxml>=5.0",
  "setuptools>=78.1",
  "jiwer>=3.0.4",
  "protobuf>=4.25.0",
  "sentencepiece>=0.2.0"

]

keywords = [
    "flow-project",
    "inference",
    "evaluation",
    "trocr",
    "transformers",
    "digital-humanities",
    "htr",
    "handwritten-text-recognition",
    "datasets",
    "huggingface",
    "nlp",
    "machine-learning",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Repository = "https://github.com/The-Flow-Project/package-trocr-inference"

[tool.setuptools.packages]
find = { include = ["flow_inference*"] }

[tool.setuptools.package-data]
flow_inference = ["utils/logging/*.yaml"]
